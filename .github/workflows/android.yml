name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # إنشاء ملف settings.gradle.kts تلقائياً إذا كان مفقوداً في المجلد الرئيسي
      - name: Ensure settings.gradle.kts exists
        run: |
          if [ ! -f "settings.gradle.kts" ] && [ ! -f "settings.gradle" ]; then
            echo 'include(":app")' > settings.gradle.kts
          fi

      # بناء الـ APK باستخدام Gradle مباشرة دون الحاجة لملف gradlew
      - name: Build Debug APK
        run: gradle :app:assembleDebug

      # رفع ملف الـ APK النهائي لتنزيله مباشرة من GitHub Actions
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
